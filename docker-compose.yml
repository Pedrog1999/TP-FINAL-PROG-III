version: '3.8'

services:

  frontend:
    build:
      context: ./front
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    build:
      context: ./back
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./back:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: tp_final_db
      DB_USER: tp_user
      DB_PASS: tp_password
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tp_final_db
      MYSQL_USER: tp_user
      MYSQL_PASSWORD: tp_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: